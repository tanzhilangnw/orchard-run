<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="奶龙大冒险：三关像素横版跳跃游戏。"><title>奶龙大冒险 · Orchard Run</title>
  <style>
    :root{--ink:#133943;--cream:#fff2ce;--leaf:#9dca87;--gold:#ffc96f}*{box-sizing:border-box}body{margin:0;color:var(--cream);background:linear-gradient(#5fb7ca 0 48%,#27626a 48%);font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh}main{width:min(960px,calc(100% - 36px));margin:auto;padding:72px 0 48px}.tag{color:#e9f3bf;font-size:.78rem;letter-spacing:.16em}h1{font-size:clamp(2.4rem,7vw,5rem);line-height:1;margin:.35rem 0 1rem;text-shadow:4px 4px 0 #2f7074}.lead{max-width:620px;line-height:1.8;font-size:1.1rem}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 72px}a.button{display:inline-block;padding:14px 20px;border:2px solid #245960;border-radius:8px;color:#173a40;background:var(--gold);text-decoration:none;font-weight:800;box-shadow:4px 4px 0 #245960}a.button.alt{background:var(--leaf)}.dragon{position:relative;width:200px;height:130px;margin:0 0 28px}.dragon img{width:260px;height:auto;object-fit:cover;object-position:left top;clip-path:inset(0 75% 0 0);transform:translateY(-12px)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}article{min-height:190px;padding:21px;border:2px solid #7ea79a;border-radius:12px;background:#163f49e8;box-shadow:5px 5px 0 #10313a}article span{color:var(--gold);font-size:.82rem}article h2{margin:.6rem 0;font-size:1.35rem}article p{margin:0;line-height:1.7;color:#e4efd4}footer{margin-top:68px;color:#d8e9cf;font-size:.85rem;opacity:.9}@media(max-width:680px){main{padding-top:46px}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <div class="tag">MILK DRAGON RUN · PIXEL PLATFORMER</div><h1>奶龙大冒险</h1>
  <div class="dragon"><img src="assets/milk_dragon_hero.png" alt="奶龙小龙主角"></div>
  <p class="lead">跟着奶龙跑过果园、暮林与糖山。三关像素横版跳跃，旗帜记录进度，悬空路线藏着水果挑战。</p>
  <div class="actions"><a class="button" href="https://github.com/tanzhilangnw/orchard-run/releases/latest">下载 Windows 版</a><a class="button alt" href="https://github.com/tanzhilangnw/orchard-run">查看源代码</a></div>
  <section class="cards"><article><span>LEVEL 01</span><h2>云朵果园</h2><p>在晨光和苹果之间熟悉跑跳节奏。</p></article><article><span>LEVEL 02</span><h2>蜂蜜暮林</h2><p>沿着暮色高台收集熟透的橙子。</p></article><article><span>LEVEL 03</span><h2>月光糖山</h2><p>抵达月光照亮的山顶奖杯。</p></article></section>
  <footer>Windows 版 · A/D 或方向键移动 · 空格跳跃 · F11 全屏</footer>
</main></body></html>
